services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_DB_PASSWORD:?Set HIVE_DB_PASSWORD in infrastructure/.env}
    volumes:
      - hive_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  hive_metadata:
