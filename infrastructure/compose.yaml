name: credit-risk

services:
  namenode:
    image: apache/hadoop:3.5.0
    user: "0:0"
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/name
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode_data:/data
    mem_limit: 1g

  datanode:
    image: apache/hadoop:3.5.0
    user: "0:0"
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - hadoop.env
    depends_on:
      - namenode
    volumes:
      - datanode_data:/data
    mem_limit: 1g

volumes:
  namenode_data:
  datanode_data:
